name: goreleaser
permissions:
  contents: write
on:
  push:
    # run only against tags
    tags:
      - '*'

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: ./tests/retry.sh git fetch --force --tags

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      # goreleaser's go mod tidy hook finds the modules in the cache then;
      # the release itself publishes, so it isn't retried
      - name: Get dependencies
        run: ./tests/retry.sh go mod download

      - name: Run Releaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
