name: azurite functional tests
permissions: {}
on: pull_request

jobs:
  test:
    runs-on: ubuntu-latest
              
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
        id: go

      - name: Set up Docker Compose
        run: |
          docker compose -f tests/docker-compose.yml --env-file .env.dev --project-directory . up -d azurite azuritegw

      - name: Wait for services to be ready
        run: |
          timeout 180 bash -c 'until curl -s -o /dev/null http://127.0.0.1:7070/; do sleep 2; done'

      - name: Get Dependencies
        run: |
          go mod download
  
      - name: Build and Run
        run: |
          make
          ./versitygw test -a user -s pass -e http://127.0.0.1:7070 full-flow --azure

      - name: Run gateway IAM tests with the Azure IAM service
        env:
          AWS_ACCESS_KEY_ID: user
          AWS_SECRET_ACCESS_KEY: pass
          AWS_REGION: us-east-1
        run: |
          set -a; . ./.env.dev; set +a
          # the azure backend gateway creates the IAM container
          aws --endpoint-url http://127.0.0.1:7070 s3 mb s3://vgwiam
          mkdir -p /tmp/aziamgw /tmp/aziamgw2
          # two gateways share the IAM container, as replicas would; the
          # path of the self-signed Azurite certificate must be absolute as
          # the posix backend changes to its root directory. --iam-debug only
          # logs with a log level other than silent.
          SSL_CERT_FILE=$PWD/tests/certs/azurite.pem ./versitygw -p :7072 -a user -s pass \
            --log-level debug --iam-debug \
            --iam-azure-account $AZ_ACCOUNT_NAME --iam-azure-access-key $AZ_ACCOUNT_KEY \
            --iam-azure-url https://127.0.0.1:10000/$AZ_ACCOUNT_NAME --iam-azure-container vgwiam \
            posix /tmp/aziamgw > /tmp/aziamgw.log 2>&1 &
          GW_PID=$!
          SSL_CERT_FILE=$PWD/tests/certs/azurite.pem ./versitygw -p :7073 -a user -s pass \
            --log-level debug --iam-debug \
            --iam-azure-account $AZ_ACCOUNT_NAME --iam-azure-access-key $AZ_ACCOUNT_KEY \
            --iam-azure-url https://127.0.0.1:10000/$AZ_ACCOUNT_NAME --iam-azure-container vgwiam \
            posix /tmp/aziamgw2 > /tmp/aziamgw2.log 2>&1 &
          GW2_PID=$!
          trap 'kill $GW_PID $GW2_PID 2>/dev/null || true' EXIT
          timeout 30 bash -c 'until curl -s -o /dev/null http://127.0.0.1:7072/; do sleep 1; done'
          timeout 30 bash -c 'until curl -s -o /dev/null http://127.0.0.1:7073/; do sleep 1; done'
          # concurrent updates through both gateways, while users.json does
          # not exist yet, so the first write races too
          ./versitygw test -a user -s pass -e http://127.0.0.1:7072 IAM_concurrent_user_updates & P1=$!
          ./versitygw test -a user -s pass -e http://127.0.0.1:7073 IAM_concurrent_user_updates & P2=$!
          wait $P1
          wait $P2
          echo "conflicts retried: $(cat /tmp/aziamgw.log /tmp/aziamgw2.log | grep -c 'changed concurrently' || true)"
          ./versitygw test -a user -s pass -e http://127.0.0.1:7072 gw-iam
          # gw-iam passes with any IAM service, so check that the accounts
          # were really stored in the Azure container
          aws --endpoint-url http://127.0.0.1:7070 s3api head-object --bucket vgwiam --key users.json

      - name: Show the Azure IAM gateway logs
        if: failure()
        run: cat /tmp/aziamgw.log /tmp/aziamgw2.log || true

      - name: Shut down services
        run: |
          docker compose -f tests/docker-compose.yml --env-file .env.dev --project-directory . down azurite azuritegw
