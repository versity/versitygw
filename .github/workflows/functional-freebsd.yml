name: functional tests (freebsd)
permissions: {}
on: pull_request

jobs:
  build:
    name: RunTestsFreeBSD
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v7

    # GitHub has no FreeBSD runners, so the tests run in a FreeBSD VM booted
    # under KVM on the Ubuntu runner. The workspace is synced into the VM, and
    # prepare/run execute there as root under sh with set -eu.
    - name: Build and Run
      uses: vmactions/freebsd-vm@v1
      with:
        release: '15.1'
        copyback: false
        # The action defaults to 6 GB, which the race-instrumented gateway and
        # test client outgrow under --parallel, and the kernel OOM-kills one of
        # them. The runner has 16 GB; leave the rest for the host and QEMU.
        mem: '12288'
        prepare: |
          pkg install -y bash git gmake
          GO_VERSION=$(fetch -qo - 'https://go.dev/VERSION?m=text' | head -n 1)
          fetch -qo /tmp/go.tar.gz "https://go.dev/dl/${GO_VERSION}.freebsd-$(uname -m).tar.gz"
          tar -C /usr/local -xzf /tmp/go.tar.gz
          ln -s /usr/local/go/bin/go /usr/local/bin/go
          pw useradd tester -m
          chown -R tester .
          # FreeBSD enables ASLR by default, and binaries built with -race
          # refuse to start under it.
          sysctl kern.elf64.aslr.enable=0
          # The VM image is root-on-ZFS, and by default the ARC may grow to
          # all RAM but 1 GB, caching object data the tests never read back.
          # It does not shrink fast enough when the tests allocate quickly, so
          # cap it and leave the memory to the test processes.
          sysctl vfs.zfs.arc.max=2147483648
        # Run as a regular user, like the Linux job does.
        run: |
          su tester -c 'gmake testbin'
          if ! su tester -c 'bash ./runtests.sh'; then
            # A test process that dies with "Killed" was most likely OOM-killed;
            # the kernel log names it and the memory state shows why.
            echo "=== kernel log ==="
            dmesg | tail -n 50 || true
            echo "=== memory ==="
            top -b -o res 15 || true
            swapinfo -h || true
            sysctl kstat.zfs.misc.arcstats.size kstat.zfs.misc.arcstats.c_max || true
            exit 1
          fi
          su tester -c 'go tool covdata percent -i=/tmp/covdata'
